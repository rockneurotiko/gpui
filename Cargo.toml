[workspace]
resolver = "2"
members = [
  "apps/gpui/native",
  "apps/gpui_components/native",
  "apps/gpui_native/native",
]
exclude = ["apps/gpui_native/test/support/desktop/drivers/linux"]

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }

[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "apps/gpui_native/native/compat/ztracing" }

# gpui_native names its sibling crates by git so it builds from a sparse checkout of its own
# directory; inside this workspace they resolve to the local sources.
[patch."https://github.com/rockneurotiko/gpui"]
gpui_core = { path = "apps/gpui/native" }
gpui_components = { path = "apps/gpui_components/native" }
